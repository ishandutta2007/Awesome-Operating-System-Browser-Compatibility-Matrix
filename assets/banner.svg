<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="340" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 340"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b14"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="subGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-width=".8" d="M 40 0 L 0 0 0 40" opacity=".6"/><circle cx="40" cy="40" r="1.5" fill="#38bdf8" opacity=".3"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="badgeGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(20px,-15px);opacity:.6}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes pulseRadar{0%{r:15px;opacity:.8}}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:38px;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:16px;letter-spacing:.2px}.badge-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,monospace;font-size:12px;font-weight:600}.orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 80px}.orb-2{animation:pulseOrb 10s ease-in-out infinite reverse;transform-origin:1000px 240px}.pill-anim-1{animation:floatPill 5s ease-in-out infinite}.pill-anim-2{animation:floatPill 6s ease-in-out infinite 1.2s}.pill-anim-3{animation:floatPill 5.5s ease-in-out infinite .6s}.pill-anim-4{animation:floatPill 6.5s ease-in-out infinite 2s}.pill-anim-5{animation:floatPill 5.2s ease-in-out infinite 1.8s}.stream-line{stroke-dasharray:8 12;animation:dashStream 6s linear infinite}</style><rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/><rect width="100%" height="100%" fill="url(#grid)" rx="16"/><circle cx="220" cy="90" r="130" fill="#38bdf8" class="orb-1" filter="url(#glow)" opacity=".25"/><circle cx="980" cy="220" r="140" fill="#a855f7" class="orb-2" filter="url(#glow)" opacity=".22"/><circle cx="600" cy="300" r="100" fill="#6366f1" filter="url(#glow)" opacity=".15"/><path fill="none" stroke="#38bdf8" stroke-width="1.8" d="M 50 280 C 300 240, 450 310, 750 260 S 1050 300, 1150 250" class="stream-line" opacity=".4"/><path fill="none" stroke="#818cf8" stroke-width="1.5" d="M 80 70 C 350 110, 500 40, 800 90 S 1080 50, 1140 100" class="stream-line" opacity=".35"/><g transform="translate(1100, 70)"><circle cx="0" cy="0" r="6" fill="#38bdf8"/><circle cx="0" cy="0" r="25" fill="none" stroke="#38bdf8" stroke-width="1" opacity=".4"/><circle cx="0" cy="0" r="50" fill="none" stroke="#38bdf8" stroke-width="1" opacity=".2"/><circle cx="0" cy="0" fill="none" stroke="#38bdf8" stroke-width="1.5" class="radar-wave"><animate attributeName="r" dur="3s" repeatCount="indefinite" values="6;60"/><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0.8;0"/></circle></g><g class="pill-anim-1" transform="translate(60, 45)"><rect width="150" height="34" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity=".9" rx="17"/><circle cx="20" cy="17" r="6" fill="#38bdf8"/><text x="35" y="22" fill="#e2e8f0" class="badge-text">🪟 Win 11 • Chrome</text></g><g class="pill-anim-2" transform="translate(860, 42)"><rect width="145" height="34" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity=".9" rx="17"/><circle cx="20" cy="17" r="6" fill="#c084fc"/><text x="35" y="22" fill="#e2e8f0" class="badge-text">🍎 macOS • Safari</text></g><g class="pill-anim-3" transform="translate(90, 265)"><rect width="145" height="34" fill="#1e293b" stroke="#f97316" stroke-width="1.2" opacity=".9" rx="17"/><circle cx="20" cy="17" r="6" fill="#fb923c"/><text x="35" y="22" fill="#e2e8f0" class="badge-text">🐧 Linux • Firefox</text></g><g class="pill-anim-4" transform="translate(485, 275)"><rect width="230" height="34" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity=".9" rx="17"/><circle cx="20" cy="17" r="6" fill="#34d399"/><text x="35" y="22" fill="#e2e8f0" class="badge-text">📱 iOS &amp; Android Real Devices</text></g><g class="pill-anim-5" transform="translate(950, 265)"><rect width="180" height="34" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" opacity=".9" rx="17"/><circle cx="20" cy="17" r="6" fill="#818cf8"/><text x="35" y="22" fill="#e2e8f0" class="badge-text">⚡ MDN BCD • Baseline</text></g><g><g transform="translate(600, 142) translate(0, -28)"><rect width="280" height="30" x="-140" y="-16" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" opacity=".95" rx="15"/><text x="0" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">🌐 CROSS-BROWSER &amp; OS COMPATIBILITY</text></g><text x="0" y="32" fill="url(#titleGrad)" class="title-text" filter="drop-shadow(0px 3px 12px rgba(0,0,0,0.8))" text-anchor="middle" transform="translate(600, 142)">Awesome OS &amp; Browser Compatibility Matrix</text><text x="0" y="70" fill="url(#subGrad)" class="subtitle-text" filter="drop-shadow(0px 2px 6px rgba(0,0,0,0.9))" text-anchor="middle" transform="translate(600, 142)">Curated Cloud Device Grids • Continuou